[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillvet"
version = "0.1.0"
description = "Lint Agent Skills before an agent loads them: frontmatter, context budget, links and supply-chain risks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "skillvet contributors" }]
keywords = [
    "agent-skills",
    "skill-md",
    "claude-code",
    "codex",
    "cursor",
    "ai-agents",
    "linter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
skillvet = "skillvet.cli:main"

[project.urls]
Homepage = "https://github.com/sakura58/skillvet"
Repository = "https://github.com/sakura58/skillvet"
Issues = "https://github.com/sakura58/skillvet/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
