name: skillvet
description: Lint Agent Skills (SKILL.md) for broken frontmatter, context bloat and supply-chain risks.
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: File or directory to scan.
    required: false
    default: "."
  fail-on:
    description: Lowest severity that fails the job (error, warning or none).
    required: false
    default: error

runs:
  using: composite
  steps:
    - name: Install skillvet
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - name: Vet skills
      shell: bash
      run: skillvet "${{ inputs.path }}" --format github --fail-on "${{ inputs['fail-on'] }}"
